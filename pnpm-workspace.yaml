packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - bcrypt
  - esbuild
  - lmdb
  - msgpackr-extract
  - prisma
  - unrs-resolver

# Parches de seguridad para dependencias transitivas (revisar con `pnpm audit`).
overrides:
  multer: '>=2.5.0 <3'
  undici: '>=7.30.1 <8'
  js-yaml@>=5.0.0 <6: '>=5.4.1 <6'
  postcss-selector-parser@>=7 <8: '>=7.1.6 <8'
