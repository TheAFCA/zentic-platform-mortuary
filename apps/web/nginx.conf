server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 es el DNS embebido de Docker. Sin esto, nginx resuelve "zentic_api"
    # a IP una sola vez al arrancar y la cachea para siempre — si el contenedor de la
    # API se redeploya y cambia de IP, nginx sigue apuntando a la IP vieja y da 502
    # (connection refused) hasta que se reinicia nginx manualmente.
    resolver 127.0.0.11 valid=10s;

    # Proxy hacia la API
    location /api {
        set $api_upstream http://zentic_api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
