<div class="share-buttons">
  <a
    class="share-buttons__btn share-buttons__btn--whatsapp"
    [href]="whatsappUrl"
    target="_blank"
    rel="noopener"
    data-testid="share-whatsapp"
  >
    Compartir en WhatsApp
  </a>
  <button
    type="button"
    class="share-buttons__btn"
    data-testid="share-copy-link"
    (click)="copyLink()"
  >
    {{ copied() ? '¡Copiado!' : 'Copiar enlace' }}
  </button>
  <a class="share-buttons__btn" [href]="mailtoUrl" data-testid="share-email">Compartir por email</a>
</div>
