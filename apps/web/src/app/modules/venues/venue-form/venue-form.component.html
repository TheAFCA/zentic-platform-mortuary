<form class="venue-form" [formGroup]="form" (ngSubmit)="submit()">
  <p class="venue-form__error" *ngIf="errorMessage" data-testid="venue-form-error">{{ errorMessage }}</p>

  <mat-form-field appearance="outline">
    <mat-label>Nombre de la sede</mat-label>
    <input matInput formControlName="name" data-testid="venue-name-input" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Dirección</mat-label>
    <input matInput formControlName="address" data-testid="venue-address-input" />
  </mat-form-field>

  <div class="venue-form__actions">
    <button type="button" class="btn-ghost" (click)="cancel.emit()">Cancelar</button>
    <button type="submit" class="btn-primary" data-testid="venue-form-submit">
      {{ isEditing ? 'Guardar cambios' : 'Crear sede' }}
    </button>
  </div>
</form>
