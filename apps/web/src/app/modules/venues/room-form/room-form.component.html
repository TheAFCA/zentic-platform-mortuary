<form class="room-form" [formGroup]="form" (ngSubmit)="submit()">
  <p class="room-form__error" *ngIf="errorMessage" data-testid="room-form-error">{{ errorMessage }}</p>

  <mat-form-field appearance="outline">
    <mat-label>Nombre de la sala</mat-label>
    <input matInput formControlName="name" data-testid="room-name-input" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Capacidad</mat-label>
    <input matInput type="number" formControlName="capacity" data-testid="room-capacity-input" />
  </mat-form-field>

  <div class="room-form__actions">
    <button type="button" class="btn-ghost btn-ghost--sm" (click)="cancel.emit()">Cancelar</button>
    <button type="submit" class="btn-primary btn-primary--sm" data-testid="room-form-submit">
      {{ isEditing ? 'Guardar' : 'Agregar sala' }}
    </button>
  </div>
</form>
