<div class="admins-page">
  <header class="admins-page__header">
    <p class="admins-page__eyebrow">Super Admin</p>
    <h1 class="admins-page__title">Usuarios Super Admin</h1>
    <p class="admins-page__subtitle">Gestiona quién tiene acceso al panel de plataforma</p>
  </header>

  <section class="panel-card">
    <div class="panel-card__header">
      <h2>Crear Super Admin</h2>
    </div>
    <div class="panel-card__body">
      <p class="admins-page__error" *ngIf="createError()">{{ createError() }}</p>
      <div class="admins-page__create-row">
        <input
          type="email"
          placeholder="email@zentic.pro"
          [ngModel]="newEmail()"
          (ngModelChange)="newEmail.set($event)"
          [ngModelOptions]="{ standalone: true }"
        />
        <button type="button" class="btn-primary" (click)="createSuperAdmin()">Crear</button>
      </div>
    </div>
  </section>

  <section class="panel-card">
    <div class="panel-card__header">
      <h2>Super Admins</h2>
      <p class="panel-card__count">{{ admins().length }} usuario(s)</p>
    </div>
    <div class="panel-card__body panel-card__body--flush">
      <app-data-table [columns]="columns" [rows]="admins()" emptyMessage="No hay Super Admins registrados">
        <ng-template #rowActions let-admin>
          <div class="admins-table__actions">
            <app-badge [color]="admin.active ? 'green' : 'gray'">
              {{ admin.active ? 'Activo' : 'Inactivo' }}
            </app-badge>
            <button type="button" class="btn-ghost btn-ghost--sm" (click)="askToggleActive(admin)">
              {{ admin.active ? 'Desactivar' : 'Reactivar' }}
            </button>
          </div>
        </ng-template>
      </app-data-table>
    </div>
  </section>

  <app-confirm-dialog
    [open]="confirmTarget() !== null"
    title="Confirmar cambio de estado"
    [message]="confirmTarget()?.active ? 'Este Super Admin no podrá iniciar sesión.' : 'Este Super Admin podrá volver a iniciar sesión.'"
    (confirm)="confirmToggle()"
    (cancel)="cancelConfirm()"
  >
    <p class="admins-page__error" *ngIf="confirmError()">{{ confirmError() }}</p>
  </app-confirm-dialog>
</div>
