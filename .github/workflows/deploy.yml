name: CI/CD - Zentic Platform

on:
  push:
    branches:
      - main
      - dev
      - stage

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #######################################
      # Build & Push API
      #######################################
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/zentic-api:latest
            ghcr.io/${{ env.OWNER_LC }}/zentic-api:${{ github.ref_name }}

      #######################################
      # Build & Push WEB
      #######################################
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/zentic-web:latest
            ghcr.io/${{ env.OWNER_LC }}/zentic-web:${{ github.ref_name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      #######################################
      # Trigger Portainer Stack Redeploy
      #######################################
      - name: Deploy API stack via Portainer webhook
        env:
          PORTAINER_WEBHOOK_API: ${{ secrets.PORTAINER_WEBHOOK_API }}
        run: |
          test -n "$PORTAINER_WEBHOOK_API"
          curl -X POST "$PORTAINER_WEBHOOK_API"

      - name: Deploy Web stack via Portainer webhook
        env:
          PORTAINER_WEBHOOK_WEB: ${{ secrets.PORTAINER_WEBHOOK_WEB }}
        run: |
          test -n "$PORTAINER_WEBHOOK_WEB"
          curl -X POST "$PORTAINER_WEBHOOK_WEB"
