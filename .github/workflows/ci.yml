name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  api-lint-test-build:
    name: API — Lint / Test / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zentic
          POSTGRES_PASSWORD: password
          POSTGRES_DB: zentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://zentic:password@localhost:5432/zentic_test
      DATABASE_SHADOW_URL: postgresql://zentic:password@localhost:5432/zentic_shadow
      JWT_SECRET: ci-jwt-secret-min-32-chars-long-ok
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-ok
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Prisma validate
        run: pnpm prisma validate
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test --passWithNoTests

      - name: Test coverage
        run: pnpm test:cov --passWithNoTests

      - name: Build
        run: pnpm build

  web-lint-build:
    name: Web — Lint / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
